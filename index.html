<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Or Return</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./index.css">
</head>
<body>

    <h1>🔍 Keep Or Return</h1>
    
    <div class="controls-container">
        <label for="storeSelect">1. Vyberte obchod (STORE):</label>
        <select id="storeSelect">
            <option value="">Načítám data...</option>
        </select>

        <label for="manualInput">2. Naskenujte nebo zadejte kód:</label>
        <div id="reader"></div>
        <button id="startBtn" class="btn btn-primary" onclick="startScan()" disabled>📷 Zapnout kameru</button>
        <button id="stopBtn" class="btn btn-stop" onclick="stopScan()">❌ Zastavit kameru</button>
        <input type="number" id="manualInput" placeholder="EAN / TPN / TPNB..." oninput="manualSearch(this.value)" disabled>
    </div>

    <div id="result" class="card">
        <!-- Hero: Product Title & Store Tag -->
        <div class="result-hero">
            <div class="hero-icon">📦</div>
            <div class="hero-details">
                <span class="store-chip" id="resStoreChip">Obchod</span>
                <h2 id="resDesc" class="product-title">Název produktu</h2>
            </div>
        </div>

        <!-- Highlighted Comment Box -->
        <div class="result-section comment-section" id="resCommentBox">
            <div class="section-header">
                <span class="section-icon">💬</span>
                <span class="section-label">Komentář</span>
            </div>
            <div class="section-content comment-text" id="resKomment">-</div>
        </div>

        <!-- Highlighted Supplier Box -->
        <div class="result-section supplier-section" id="resSupplierBox">
            <div class="section-header">
                <span class="section-icon">🏭</span>
                <span class="section-label">Dodavatel</span>
            </div>
            <div class="section-content supplier-text" id="resSupplier">-</div>
        </div>

        <!-- Technical Parameters Grid -->
        <div class="tech-details-container">
            <h3 class="tech-title">Technické údaje</h3>
            <div class="tech-grid">
                <div class="tech-item">
                    <span class="tech-label">EAN</span>
                    <span class="tech-value" id="resEan">-</span>
                </div>
                <div class="tech-item">
                    <span class="tech-label">TPN</span>
                    <span class="tech-value" id="resTpn">-</span>
                </div>
                <div class="tech-item">
                    <span class="tech-label">TPNB</span>
                    <span class="tech-value" id="resTpnb">-</span>
                </div>
                <div class="tech-item">
                    <span class="tech-label">DRG</span>
                    <span class="tech-value" id="resDrg">-</span>
                </div>
            </div>
        </div>
    </div>

    <div id="error">
        ❌ Kód nenalezen ve vybraném obchodě.
    </div>

    <script>
        window.onerror = function(msg, url, line) {
            alert("⚠️ CHYBA APLIKACE:\n" + msg + "\nSoubor: " + url + "\nŘádek: " + line);
        };
    </script>

    <script src="./html5-qrcode.min.js"></script>
    <script src="./papaparse.min.js"></script>

    <script>
        let inventoryData = [];
        let html5QrCode;
        const storeSelect = document.getElementById('storeSelect');
        const startBtn = document.getElementById('startBtn');
        const manualInput = document.getElementById('manualInput');

        // 1. Načtení dat při startu
        Papa.parse("./data.csv", { // ZMĚNA: Přidáno ./ pro jistotu
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                inventoryData = results.data;
                console.log("Data načtena, řádků:", inventoryData.length);
                
                // DIAGNOSTIKA: Kontrola prázdných dat
                if (!inventoryData || inventoryData.length === 0) {
                     alert("⚠️ Data načtena, ale jsou prázdná! Zkontrolujte data.csv.");
                }
                
                populateStoreDropdown();
            },
            error: function(err) {
                alert("❌ Chyba načítání data.csv: " + err.message);
            }
        });

        // 2. Naplnění dropdown menu obchody
        function populateStoreDropdown() {
            // Získáme unikátní seznam obchodů ze sloupce 'STORE'
            const stores = [...new Set(inventoryData.map(item => item.STORE).filter(s => s))];
            // Seřadíme je numericky nebo abecedně
            stores.sort((a, b) => a - b);

            storeSelect.innerHTML = '<option value="">-- Vyberte obchod --</option>';
            stores.forEach(store => {
                const option = document.createElement('option');
                option.value = store;
                option.textContent = "Obchod " + store;
                storeSelect.appendChild(option);
            });
        }

        // Aktivace/deaktivace prvků podle výběru obchodu
        storeSelect.addEventListener('change', function() {
            const isSelected = this.value !== "";
            startBtn.disabled = !isSelected;
            manualInput.disabled = !isSelected;
            
            // Reset zobrazení při změně obchodu
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            manualInput.value = '';
            if (!isSelected) stopScan();
        });


        // 3. Hlavní vyhledávací funkce
        function search(query) {
            const selectedStore = storeSelect.value;
            if (!selectedStore) {
                alert("Prosím, nejprve vyberte obchod.");
                return;
            }

            const cleanedQuery = query.toString().trim();

            // HLAVNÍ LOGIKA: Filtruj podle obchodu A ZÁROVEŇ hledej v EAN, TPN nebo TPNB
            const item = inventoryData.find(row => {
                // Podmínka 1: Řádek musí patřit vybranému obchodu
                const storeMatch = row.STORE == selectedStore;
                
                // Podmínka 2: Kód se musí shodovat s jedním z těchto sloupců
                // Používáme volné porovnání (==) a trim() pro jistotu, že sedí stringy i čísla
                const codeMatch = (row.EAN && row.EAN.trim() == cleanedQuery) ||
                                  (row.TPN && row.TPN.trim() == cleanedQuery) ||
                                  (row.TPNB && row.TPNB.trim() == cleanedQuery);

                return storeMatch && codeMatch;
            });
            
            if (item) {
                // if(beep) beep.play(); // Pípnutí
                showResult(item);
            } else {
                showError();
            }
        }

        // Zobrazení výsledku (napojení na vaši strukturu dat)
        function showResult(item) {
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            
            // Pozor: Sloupec v Excelu se jmenuje "Desc." (s tečkou), v JS musíme použít závorky ['Desc.']
            document.getElementById('resDesc').textContent = item['Desc.'] || "Bez názvu";
            document.getElementById('resStoreChip').textContent = "Obchod " + (item.STORE || "");
            document.getElementById('resEan').textContent = item.EAN || "-";
            document.getElementById('resTpn').textContent = item.TPN || "-";
            document.getElementById('resTpnb').textContent = item.TPNB || "-";
            document.getElementById('resDrg').textContent = item.DRG || "-";
            
            // Comment visibility and text
            const commentBox = document.getElementById('resCommentBox');
            if (item.KOMMENT && item.KOMMENT.trim() !== "") {
                document.getElementById('resKomment').textContent = item.KOMMENT;
                commentBox.style.display = 'flex';
            } else {
                commentBox.style.display = 'none';
            }
            
            // Supplier visibility and text
            const supplierBox = document.getElementById('resSupplierBox');
            if (item.Supplier && item.Supplier.trim() !== "") {
                document.getElementById('resSupplier').textContent = item.Supplier;
                supplierBox.style.display = 'flex';
            } else {
                supplierBox.style.display = 'none';
            }
        }

        function showError() {
            document.getElementById('result').style.display = 'none';
            
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'flex';
        }

        function manualSearch(val) {
            if(val.length >= 3) search(val);
        }

        // --- Funkce pro kameru (zůstávají stejné) ---
        function startScan() {
            document.getElementById('reader').style.display = 'block';
            startBtn.style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            html5QrCode = new Html5Qrcode("reader");
            // Zkusíme použít zadní kameru, preferujeme environment
            const config = { fps: 10, qrbox: { width: 250, height: 250 }, defineReaderConfig: { cameraSupportsTorch: true } };
            
            html5QrCode.start({ facingMode: "environment" }, config,
                (decodedText) => {
                    stopScan();
                    manualInput.value = decodedText;
                    search(decodedText);
                },
                () => {} // Ignorujeme chyby při běhu skenování
            ).catch(err => {
                alert("Chyba kamery: Ujistěte se, že jste na HTTPS a povolili jste přístup.");
                stopScan();
            });
        }

        function stopScan() {
            if(html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    resetCameraUI();
                    html5QrCode.clear();
                }).catch(() => resetCameraUI());
            } else {
                resetCameraUI();
            }
        }

        function resetCameraUI() {
            document.getElementById('reader').style.display = 'none';
            startBtn.style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
        }

        // Registrace SW pro offline režim
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }
    </script>
</body>
</html>
